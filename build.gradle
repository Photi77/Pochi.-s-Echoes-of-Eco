plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.123'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = '0.0.5-1.21.11'
group = 'com.pochi.pochimod'
base.archivesName = 'EchoesOfEco'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pochimod'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pochimod'
        }

        clientData {
            clientData()
            programArgument '--mod'
            programArgument 'pochimod'
            programArgument '--all'
            programArgument '--output'
            programArgument file('src/generated/resources/').absolutePath
            programArgument '--existing'
            programArgument file('src/main/resources/').absolutePath
        }

        serverData {
            serverData()
            programArgument '--mod'
            programArgument 'pochimod'
            programArgument '--all'
            programArgument '--output'
            programArgument file('src/generated/resources/').absolutePath
            programArgument '--existing'
            programArgument file('src/main/resources/').absolutePath
        }
    }

    mods {
        pochimod {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "BlameJared Maven (JEI)"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "GeckoLib"
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = "MinecraftForge Maven (TerraBlender)"
        url = "https://maven.minecraftforge.net/"
    }
}

dependencies {
    // JEI — compile against API only, use full jar at runtime
    compileOnly("mezz.jei:jei-1.21.11-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-1.21.11-neoforge:${jei_version}")

    // GeckoLib
    implementation("software.bernie.geckolib:geckolib-neoforge-1.21.11:${geckolib_version}")

    // TerraBlender
    implementation("com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}")
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "pochimod",
                "Specification-Vendor"    : "pochimodsareus",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "pochimodsareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
